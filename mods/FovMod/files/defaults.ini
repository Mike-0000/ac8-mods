; Copy to fov.ini to customize. Upgrades do not ship/overwrite fov.ini.
; Offline single player only. Values: 0 (game-controlled) or 40-150 degrees.
Cockpit=0
HUD=0
ThirdPerson=0
Step=5
IncreaseKey=OEM_PLUS
DecreaseKey=OEM_MINUS
ToggleKey=F10
ReloadKey=F9
; Key changes take effect on the next game launch. F9 reloads FOV values.
; In-flight adjustments are committed to fov.state-a / fov.state-b.
; F9 loads fov.ini and commits those values over the saved in-flight settings.
